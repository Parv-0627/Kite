<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite — Virtual Trading</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: #387ED1; padding: 8px 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.topbar .logo { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: 2px; }
.indices { display: flex; gap: 20px; margin-left: 12px; flex: 1; overflow: hidden; }
.idx { color: #fff; font-size: 11px; white-space: nowrap; }
.idx .val { font-weight: 600; font-size: 12px; }
.idx .cup { color: #7EE8A2; }
.idx .cdn { color: #FFB3B3; }
.topbar .user { color: #fff; font-size: 12px; opacity: 0.9; margin-left: auto; white-space: nowrap; }
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar { width: 250px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-tabs { display: flex; border-bottom: 1px solid #e8e8e8; }
.stab { flex: 1; padding: 9px 4px; font-size: 11px; text-align: center; color: #999; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.stab:hover { color: #387ED1; }
.stab.active { color: #387ED1; border-bottom: 2px solid #387ED1; font-weight: 600; }
.search-box { padding: 8px; border-bottom: 1px solid #e8e8e8; }
.search-box input { width: 100%; padding: 7px 10px; font-size: 12px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9; outline: none; transition: border 0.2s; }
.search-box input:focus { border-color: #387ED1; background: #fff; }
.watchlist { flex: 1; overflow-y: auto; }
.witem { padding: 9px 12px; border-bottom: 1px solid #f2f2f2; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.1s; }
.witem:hover { background: #f8f8f8; }
.witem.active { background: #EBF2FC; }
.witem .sym { font-size: 12px; font-weight: 600; color: #333; }
.witem .exch { font-size: 10px; color: #999; margin-top: 1px; }
.witem .ltp { font-size: 12px; font-weight: 600; text-align: right; }
.witem .pct { font-size: 10px; text-align: right; margin-top: 1px; }
.up { color: #1a7a4a; }
.dn { color: #c0392b; }

/* Content */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.chart-area { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; overflow: hidden; }
.chart-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
.sym-info .sym-name { font-size: 15px; font-weight: 600; color: #333; }
.sym-info .ltp-big { font-size: 24px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.sym-info .chg-big { font-size: 13px; margin-top: 2px; }
.ohlc-row { display: flex; gap: 16px; margin-top: 4px; }
.ohlc-row span { font-size: 11px; color: #888; }
.ohlc-row b { color: #333; }
.tf-btns { display: flex; gap: 4px; margin-left: auto; align-items: flex-start; padding-top: 4px; }
.tf-btn { padding: 4px 10px; font-size: 11px; border: 1px solid #ddd; border-radius: 4px; background: #fff; color: #666; cursor: pointer; transition: all 0.2s; }
.tf-btn:hover { border-color: #387ED1; color: #387ED1; }
.tf-btn.active { background: #387ED1; color: #fff; border-color: #387ED1; font-weight: 600; }
.chart-wrap { flex: 1; position: relative; min-height: 150px; }
#mainChart { width: 100% !important; height: 100% !important; }

/* Order Panel */
.order-panel { background: #fafafa; border-top: 1px solid #e8e8e8; padding: 10px 16px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; flex-shrink: 0; }
.order-tabs { display: flex; }
.otab { padding: 7px 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #666; transition: all 0.2s; }
.otab.buy-tab { border-radius: 4px 0 0 4px; }
.otab.sell-tab { border-radius: 0 4px 4px 0; border-left: none; }
.otab.buy-tab.active { background: #1a7a4a; color: #fff; border-color: #1a7a4a; }
.otab.sell-tab.active { background: #c0392b; color: #fff; border-color: #c0392b; }
.ofield { display: flex; flex-direction: column; gap: 3px; }
.ofield label { font-size: 10px; color: #888; font-weight: 500; }
.ofield input, .ofield select { padding: 7px 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; color: #333; width: 100px; outline: none; transition: border 0.2s; }
.ofield input:focus, .ofield select:focus { border-color: #387ED1; }
.place-btn { padding: 8px 24px; font-size: 13px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; color: #fff; transition: opacity 0.2s; }
.place-btn:hover { opacity: 0.85; }
.place-btn.buy { background: #1a7a4a; }
.place-btn.sell { background: #c0392b; }
.margin-info { margin-left: auto; text-align: right; }
.margin-info label { font-size: 10px; color: #888; display: block; }
.margin-info span { font-size: 14px; font-weight: 600; color: #333; }

/* Portfolio Bar */
.portfolio-bar { background: #fff; border-top: 1px solid #e8e8e8; padding: 8px 16px; display: flex; gap: 28px; align-items: center; overflow-x: auto; flex-shrink: 0; }
.pstat { display: flex; flex-direction: column; white-space: nowrap; }
.pstat label { font-size: 10px; color: #888; font-weight: 500; }
.pstat span { font-size: 13px; font-weight: 600; color: #333; margin-top: 1px; }

/* Positions tab */
.positions-view { flex: 1; overflow-y: auto; padding: 12px; }
.pos-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.pos-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e8e8e8; font-size: 11px; color: #888; font-weight: 500; }
.pos-table td { padding: 8px 8px; border-bottom: 1px solid #f5f5f5; }
.empty-msg { text-align: center; color: #bbb; font-size: 13px; padding: 40px; }

/* Toast */
.toast { position: fixed; top: 56px; right: 16px; padding: 10px 16px; border-radius: 4px; font-size: 12px; font-weight: 500; display: none; z-index: 999; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">kite</div>
  <div class="indices" id="idxBar"></div>
  <div class="user">Yug Bhatia &nbsp;|&nbsp; <span style="opacity:0.7">Virtual ₹10,00,000</span></div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="stab active" onclick="switchTab('watchlist',this)">Watchlist</div>
      <div class="stab" onclick="switchTab('positions',this)">Positions</div>
      <div class="stab" onclick="switchTab('holdings',this)">Holdings</div>
    </div>
    <div class="search-box">
      <input placeholder="Search eg: INFY, NIFTY" id="searchInput">
    </div>
    <div class="watchlist" id="watchlistEl"></div>
  </div>

  <div class="content">
    <div class="chart-area">
      <div class="chart-header">
        <div class="sym-info">
          <div class="sym-name" id="selSym">NIFTY 50</div>
          <div class="ltp-big up" id="selLtp">24,832.15</div>
          <div class="chg-big up" id="selChg">+142.30 (+0.58%)</div>
          <div class="ohlc-row">
            <span>O: <b id="oVal">-</b></span>
            <span>H: <b id="hVal">-</b></span>
            <span>L: <b id="lVal">-</b></span>
            <span>C: <b id="cVal">-</b></span>
          </div>
        </div>
        <div class="tf-btns">
          <button class="tf-btn active" onclick="setTf(this,'1m')">1m</button>
          <button class="tf-btn" onclick="setTf(this,'5m')">5m</button>
          <button class="tf-btn" onclick="setTf(this,'15m')">15m</button>
          <button class="tf-btn" onclick="setTf(this,'1h')">1h</button>
          <button class="tf-btn" onclick="setTf(this,'1d')">1D</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div class="order-panel">
      <div>
        <div style="font-size:10px;color:#888;margin-bottom:4px;font-weight:500;">ORDER TYPE</div>
        <div class="order-tabs">
          <button class="otab buy-tab active" id="buyBtn" onclick="setOrder('buy')">BUY</button>
          <button class="otab sell-tab" id="sellBtn" onclick="setOrder('sell')">SELL</button>
        </div>
      </div>
      <div class="ofield">
        <label>PRODUCT</label>
        <select id="prodType"><option>MIS</option><option>CNC</option><option>NRML</option></select>
      </div>
      <div class="ofield">
        <label>QTY</label>
        <input type="number" id="oQty" value="1" min="1">
      </div>
      <div class="ofield">
        <label>PRICE</label>
        <input type="number" id="oPrice" value="24832">
      </div>
      <div class="ofield">
        <label>ORDER</label>
        <select id="oType"><option>Market</option><option>Limit</option><option>SL</option></select>
      </div>
      <button class="place-btn buy" id="placeBtn" onclick="placeOrder()">Place Buy Order</button>
      <div class="margin-info">
        <label>MARGIN REQUIRED</label>
        <span id="marginReq">₹24,832</span>
      </div>
    </div>

    <div class="portfolio-bar">
      <div class="pstat"><label>AVAILABLE MARGIN</label><span id="availMargin">₹10,00,000</span></div>
      <div class="pstat"><label>USED MARGIN</label><span id="usedMargin">₹0</span></div>
      <div class="pstat"><label>OPEN P&L</label><span id="openPnl" class="up">₹0</span></div>
      <div class="pstat"><label>DAY'S P&L</label><span id="dayPnl" class="up">₹0</span></div>
      <div class="pstat"><label>PORTFOLIO VALUE</label><span id="portVal">₹10,00,000</span></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const stocks = [
  { sym:'NIFTY 50',  exch:'NSE', base:24832, o:24710, h:24890, l:24680, c:24689 },
  { sym:'SENSEX',    exch:'BSE', base:81456, o:81200, h:81600, l:81100, c:81210 },
  { sym:'RELIANCE',  exch:'NSE', base:2945,  o:2930,  h:2960,  l:2920,  c:2935  },
  { sym:'TCS',       exch:'NSE', base:3812,  o:3800,  h:3840,  l:3790,  c:3805  },
  { sym:'INFY',      exch:'NSE', base:1678,  o:1670,  h:1695,  l:1665,  c:1672  },
  { sym:'HDFC BANK', exch:'NSE', base:1723,  o:1715,  h:1735,  l:1710,  c:1718  },
  { sym:'ICICI BANK',exch:'NSE', base:1298,  o:1290,  h:1310,  l:1285,  c:1295  },
  { sym:'WIPRO',     exch:'NSE', base:512,   o:508,   h:518,   l:506,   c:510   },
  { sym:'BAJAJ FIN', exch:'NSE', base:7210,  o:7180,  h:7250,  l:7160,  c:7195  },
  { sym:'MARUTI',    exch:'NSE', base:12450, o:12400, h:12520, l:12380, c:12430 },
];

let prices = stocks.map(s => ({ ...s, ltp: s.base + (Math.random()-0.5)*s.base*0.01 }));
let selIdx = 0, orderSide = 'buy';
let available = 1000000, usedMarginAmt = 0, realisedPnl = 0;
let positions = [], chartData = [], chart;

const fmtI = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtN = n => parseFloat(n.toFixed(2)).toLocaleString('en-IN');

function genCandles(base, count) {
  let candles = [], p = base * 0.985;
  for (let i = 0; i < count; i++) {
    let o = p, c = o + (Math.random()-0.48)*o*0.003;
    let h = Math.max(o,c) + Math.random()*o*0.002;
    let l = Math.min(o,c) - Math.random()*o*0.002;
    candles.push({ o, h, l, c }); p = c;
  }
  return candles;
}

function buildWatchlist() {
  const el = document.getElementById('watchlistEl');
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = prices.filter(s => s.sym.toLowerCase().includes(q));
  el.innerHTML = filtered.length ? filtered.map((s,i) => {
    const ri = prices.indexOf(s);
    const chg = s.ltp - s.c, pct = (chg/s.c*100);
    const cls = chg >= 0 ? 'up' : 'dn';
    return `<div class="witem${ri===selIdx?' active':''}" onclick="selectStock(${ri})">
      <div><div class="sym">${s.sym}</div><div class="exch">${s.exch}</div></div>
      <div><div class="ltp ${cls}">${fmtN(s.ltp)}</div><div class="pct ${cls}">${chg>=0?'+':''}${fmtN(pct)}%</div></div>
    </div>`;
  }).join('') : '<div class="empty-msg">No results</div>';
}

function updateHeader() {
  const s = prices[selIdx];
  const chg = s.ltp - s.c, pct = (chg/s.c*100);
  const cls = chg >= 0 ? 'up' : 'dn';
  document.getElementById('selSym').textContent = s.sym;
  document.getElementById('selLtp').textContent = fmtN(s.ltp);
  document.getElementById('selLtp').className = 'ltp-big ' + cls;
  document.getElementById('selChg').textContent = (chg>=0?'+':'')+fmtN(chg)+' ('+(chg>=0?'+':'')+fmtN(pct)+'%)';
  document.getElementById('selChg').className = 'chg-big ' + cls;
  document.getElementById('oVal').textContent = fmtN(s.o);
  document.getElementById('hVal').textContent = fmtN(s.h);
  document.getElementById('lVal').textContent = fmtN(s.l);
  document.getElementById('cVal').textContent = fmtN(s.c);
  document.getElementById('oPrice').value = Math.round(s.ltp);
  updateMargin();
}

function buildIdxBar() {
  document.getElementById('idxBar').innerHTML = prices.slice(0,5).map(s => {
    const chg = s.ltp - s.base, pct = (chg/s.base*100);
    const cls = chg >= 0 ? 'cup' : 'cdn';
    return `<div class="idx"><span>${s.sym} </span><span class="val">${fmtN(s.ltp)}</span> <span class="${cls}">${chg>=0?'+':''}${fmtN(pct)}%</span></div>`;
  }).join('');
}

function selectStock(i) {
  selIdx = i;
  buildWatchlist();
  updateHeader();
  chartData = genCandles(prices[i].ltp, 60);
  updateChart();
}

function setOrder(side) {
  orderSide = side;
  document.getElementById('buyBtn').className = 'otab buy-tab' + (side==='buy'?' active':'');
  document.getElementById('sellBtn').className = 'otab sell-tab' + (side==='sell'?' active':'');
  document.getElementById('placeBtn').className = 'place-btn ' + side;
  document.getElementById('placeBtn').textContent = 'Place ' + (side==='buy'?'Buy':'Sell') + ' Order';
}

function updateMargin() {
  const qty = parseInt(document.getElementById('oQty').value)||1;
  const price = parseFloat(document.getElementById('oPrice').value)||prices[selIdx].ltp;
  document.getElementById('marginReq').textContent = fmtI(qty * price);
}

function placeOrder() {
  const qty = parseInt(document.getElementById('oQty').value)||1;
  const price = parseFloat(document.getElementById('oPrice').value)||prices[selIdx].ltp;
  const req = qty * price;
  if (orderSide === 'buy') {
    if (req > available) { showToast('Insufficient margin!', '#c0392b'); return; }
    available -= req; usedMarginAmt += req;
    const existing = positions.find(p => p.sym === prices[selIdx].sym);
    if (existing) { existing.qty += qty; }
    else positions.push({ sym: prices[selIdx].sym, qty, buyPrice: price, idx: selIdx });
    showToast('✓ Bought ' + qty + ' ' + prices[selIdx].sym + ' @ ₹' + fmtN(price), '#1a7a4a');
  } else {
    const pos = positions.find(p => p.sym === prices[selIdx].sym);
    if (!pos) { showToast('No position to sell!', '#c0392b'); return; }
    const sellQty = Math.min(qty, pos.qty);
    const pnl = (price - pos.buyPrice) * sellQty;
    available += sellQty * price;
    usedMarginAmt -= sellQty * pos.buyPrice;
    realisedPnl += pnl;
    pos.qty -= sellQty;
    if (pos.qty <= 0) positions = positions.filter(p => p.sym !== prices[selIdx].sym);
    showToast('✓ Sold ' + sellQty + ' ' + prices[selIdx].sym + ' @ ₹' + fmtN(price) + ' | P&L: ' + (pnl>=0?'+':'')+fmtI(pnl), pnl>=0?'#1a7a4a':'#c0392b');
  }
  updatePortfolio();
}

function updatePortfolio() {
  let openPnl = 0;
  positions.forEach(p => { openPnl += (prices[p.idx].ltp - p.buyPrice) * p.qty; });
  document.getElementById('availMargin').textContent = fmtI(available);
  document.getElementById('usedMargin').textContent = fmtI(usedMarginAmt);
  document.getElementById('openPnl').textContent = (openPnl>=0?'+':'')+fmtI(openPnl);
  document.getElementById('openPnl').className = openPnl>=0?'up':'dn';
  document.getElementById('dayPnl').textContent = (realisedPnl>=0?'+':'')+fmtI(realisedPnl);
  document.getElementById('dayPnl').className = realisedPnl>=0?'up':'dn';
  document.getElementById('portVal').textContent = fmtI(available + usedMarginAmt + openPnl);
}

function showToast(msg, bg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = bg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function setTf(btn, tf) {
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const counts = {'1m':60,'5m':48,'15m':32,'1h':24,'1d':20};
  chartData = genCandles(prices[selIdx].ltp, counts[tf]||60);
  updateChart();
}

function switchTab(tab, el) {
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function updateChart() {
  if (!chart) return;
  const closes = chartData.map(c => parseFloat(c.c.toFixed(2)));
  const isUp = closes[closes.length-1] >= closes[0];
  const color = isUp ? '#1a7a4a' : '#c0392b';
  chart.data.labels = closes.map((_,i)=>i);
  chart.data.datasets[0].data = closes;
  chart.data.datasets[0].borderColor = color;
  chart.data.datasets[0].backgroundColor = color + '15';
  chart.update('none');
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  chartData = genCandles(prices[0].ltp, 60);
  const closes = chartData.map(c => parseFloat(c.c.toFixed(2)));
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: closes.map((_,i)=>i),
      datasets: [{ data: closes, borderColor: '#1a7a4a', backgroundColor: '#1a7a4a15', borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => '₹' + fmtN(ctx.raw) } } },
      scales: {
        x: { display: false },
        y: { position: 'right', grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 }, callback: v => fmtN(v) } }
      },
      animation: false
    }
  });
}

document.getElementById('oQty').addEventListener('input', updateMargin);
document.getElementById('oPrice').addEventListener('input', updateMargin);
document.getElementById('searchInput').addEventListener('input', buildWatchlist);

initChart();
buildWatchlist();
buildIdxBar();
updateHeader();

setInterval(() => {
  prices = prices.map(s => ({ ...s, ltp: Math.max(s.base*0.9, s.ltp + (Math.random()-0.49)*s.base*0.0008) }));
  if (chartData.length > 0) {
    const last = chartData[chartData.length-1];
    const newC = Math.max(prices[selIdx].base*0.9, last.c + (Math.random()-0.49)*prices[selIdx].base*0.0008);
    chartData.push({ o: last.c, h: Math.max(last.c,newC), l: Math.min(last.c,newC), c: newC });
    if (chartData.length > 80) chartData.shift();
    updateChart();
  }
  buildWatchlist(); buildIdxBar(); updateHeader(); updatePortfolio();
}, 1500);
</script>
</body>
</html>
